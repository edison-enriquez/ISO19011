name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos que necesita el despliegue oficial de Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancela el que ya esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run lint

      - name: Compilar
        # El sitio cuelga de /<nombre-del-repo>/ en GitHub Pages.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Copiar index.html como 404.html
        # GitHub Pages no sabe reescribir rutas al index. Sirviendo el mismo
        # documento como 404.html, cualquier ruta profunda carga la SPA y
        # React Router resuelve el destino. Sin esto, entrar directamente a
        # /iso-19011/capitulo-4 devolvería el 404 de GitHub.
        run: cp dist/index.html dist/404.html

      - name: Evitar que Jekyll procese la salida
        # Jekyll ignora los directorios que empiezan por guion bajo, y Vite
        # genera assets con nombres que pueden empezar así.
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
